<body>
<canvas id="c"></canvas>
<input id="seedIn" maxlength="10" placeholder="시드 입력 (비우면 위 시드)" autocomplete="off" autocapitalize="characters" spellcheck="false">
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SERIF='"Nanum Myeongjo",serif',PEN='"Nanum Pen Script",cursive';
try{document.fonts&&document.fonts.load('24px "Nanum Pen Script"');document.fonts&&document.fonts.load('24px "Nanum Myeongjo"');}catch(e){}
const T=32;let COLS=25,ROWS=18,W=COLS*T,H=ROWS*T;
let grid=[],LOCKERS=[],EXITW={x:-1,y:-1},MAPINFO=null,SEED='';
const opaque=(cx,cy)=>cx<0||cy<0||cx>=COLS||cy>=ROWS||grid[cy][cx]==='#'||grid[cy][cx]==='L';
const solid=(cx,cy)=>opaque(cx,cy)||grid[cy][cx]==='d'||grid[cy][cx]==='L'||grid[cy][cx]==='S';
const opaqueAt=(x,y)=>opaque(Math.floor(x/T),Math.floor(y/T));
const solidAt=(x,y)=>solid(Math.floor(x/T),Math.floor(y/T));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cell=(cx,cy)=>({x:cx*T+T/2,y:cy*T+T/2});
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---------- 맵 생성기 (시드) ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const newSeed=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
const cleanSeed=v=>(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
function generate(seedStr){const R=mulberry(hashStr(seedStr));for(let i=0;i<120;i++){const m=tryGen(R);if(m)return m;}return null;}
function tryGen(R){
  const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),D4=[[1,0],[-1,0],[0,1],[0,-1]];
  const C=ri(25,33),Rw=ri(19,24);
  const G=[],cor=[];for(let y=0;y<Rw;y++){G.push(Array(C).fill('#'));cor.push(Array(C).fill(false));}
  const inside=(x,y)=>x>0&&y>0&&x<C-1&&y<Rw-1;
  const carve=(x,y)=>{if(inside(x,y)){G[y][x]='.';cor[y][x]=true;}};
  // 가로 복도 (1개 또는 2개)
  const HC=[];
  if(R()<.6){const w1=ri(2,3),w2=ri(2,3);HC.push([ri(4,Math.floor(Rw*.42)-w1+1),w1]);HC.push([ri(Math.ceil(Rw*.58),Rw-4-w2),w2]);}
  else HC.push([ri(Math.floor(Rw*.4),Math.floor(Rw*.5)),3]);
  for(const[y,w]of HC)for(let yy=y;yy<y+w;yy++)for(let x=1;x<C-1;x++)carve(x,yy);
  // 세로 복도
  const nv=ri(1,C>=29?3:2),xs=[];
  for(let i=0;i<80&&xs.length<nv;i++){const x=ri(5,C-7);if(xs.every(o=>Math.abs(o-x)>=8))xs.push(x);}
  for(const x of xs){let y0,y1;
    if(HC.length===2){y0=HC[0][0];y1=HC[1][0]+HC[1][1]-1;if(R()<.35)y0=1;if(R()<.35)y1=Rw-2;}
    else{const hy=HC[0][0],hw=HC[0][1],up=R()<.7,down=R()<.7||!up;y0=up?1:hy;y1=down?Rw-2:hy+hw-1;}
    for(let y=y0;y<=y1;y++){carve(x,y);carve(x+1,y);}}
  // 중앙 홀: 중심에 가장 가까운 교차점을 넓게
  let hub=null;{let best=1e9;for(const x of xs)for(const[y,w]of HC){const d=Math.abs(x+.5-C/2)+Math.abs(y+w/2-Rw/2);if(d<best){best=d;hub={xv:x,yh:y,wh:w};}}}
  if(hub){hub.x0=clamp(hub.xv-3,2,C-3);hub.x1=clamp(hub.xv+4,2,C-3);hub.y0=clamp(hub.yh-2,2,Rw-3);hub.y1=clamp(hub.yh+hub.wh+1,2,Rw-3);
    for(let y=hub.y0;y<=hub.y1;y++)for(let x=hub.x0;x<=hub.x1;x++)carve(x,y);
    hub.sx=hub.xv+(R()<.5?0:1);hub.sy=Math.floor((hub.y0+hub.y1)/2);}
  // 복도 사이 직사각형 영역 → 교실 (넓으면 쪼갬)
  const seen=[];for(let y=0;y<Rw;y++)seen.push(Array(C).fill(false));
  const rooms=[];
  const split=(x0,y0,x1,y1)=>{const w=x1-x0+1,h=y1-y0+1;
    if(w>9&&(w>=h||h<=9)){const sx=ri(x0+4,x1-4);split(x0,y0,sx-1,y1);split(sx+1,y0,x1,y1);return;}
    if(h>9){const sy=ri(y0+4,y1-4);split(x0,y0,x1,sy-1);split(x0,sy+1,x1,y1);return;}
    if(w>=3&&h>=3)rooms.push({x0,y0,x1,y1});};
  for(let y=1;y<Rw-1;y++)for(let x=1;x<C-1;x++){if(cor[y][x]||seen[y][x])continue;
    let x1=x;while(x1+1<C-1&&!cor[y][x1+1])x1++;
    let y1=y;while(y1+1<Rw-1){let ok=true;for(let xx=x;xx<=x1;xx++)if(cor[y1+1][xx]){ok=false;break;}if(!ok)break;y1++;}
    for(let yy=y;yy<=y1;yy++)for(let xx=x;xx<=x1;xx++)seen[yy][xx]=true;
    split(x+(x>1?1:0),y+(y>1?1:0),x1-(x1<C-2?1:0),y1-(y1<Rw-2?1:0));}
  if(rooms.length<4)return null;
  const roomOf=[];for(let y=0;y<Rw;y++)roomOf.push(Array(C).fill(-1));
  rooms.forEach((r,i)=>{for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){G[y][x]='.';roomOf[y][x]=i;}});
  // 문
  const doorAt=[];for(let y=0;y<Rw;y++)doorAt.push(Array(C).fill(false));
  for(const r of rooms){const cand=[];
    for(let x=r.x0+1;x<r.x1;x++){cand.push([x,r.y0-1,x,r.y0-2]);cand.push([x,r.y1+1,x,r.y1+2]);}
    for(let y=r.y0+1;y<r.y1;y++){cand.push([r.x0-1,y,r.x0-2,y]);cand.push([r.x1+1,y,r.x1+2,y]);}
    const ok=cand.filter(([wx,wy,ox,oy])=>inside(wx,wy)&&G[wy][wx]==='#'&&oy>=0&&ox>=0&&oy<Rw&&ox<C&&G[oy][ox]==='.');
    const toCor=ok.filter(c=>cor[c[3]][c[2]]),toRoom=ok.filter(c=>!cor[c[3]][c[2]]);
    const picks=[];if(toCor.length)picks.push(toCor[ri(0,toCor.length-1)]);else if(toRoom.length)picks.push(toRoom[ri(0,toRoom.length-1)]);
    if(R()<.45&&ok.length)picks.push(ok[ri(0,ok.length-1)]);
    for(const[wx,wy]of picks){G[wy][wx]='.';doorAt[wy][wx]=true;}}
  const nearDoor=(x,y)=>doorAt[y][x]||D4.some(([dx,dy])=>doorAt[y+dy]&&doorAt[y+dy][x+dx]);
  // 책상
  for(const r of rooms){const w=r.x1-r.x0+1,h=r.y1-r.y0+1;r.cls=w>=5&&h>=4&&R()<.82;if(!r.cls)continue;
    for(let y=r.y0+1;y<r.y1;y+=2)for(let x=r.x0+1;x<r.x1;x+=2)if(R()<.85&&!nearDoor(x,y))G[y][x]='d';}
  if(hub)G[hub.sy][hub.sx]='S';
  const walk=(x,y)=>G[y][x]==='.'||G[y][x]==='E';
  const bfs=(sx,sy)=>{const d=[];for(let y=0;y<Rw;y++)d.push(Array(C).fill(-1));d[sy][sx]=0;const q=[[sx,sy]];let h=0;
    while(h<q.length){const[x,y]=q[h++];for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inside(nx,ny)||d[ny][nx]>=0||!walk(nx,ny))continue;d[ny][nx]=d[y][x]+1;q.push([nx,ny]);}}return d;};
  const allCells=()=>{const a=[];for(let y=1;y<Rw-1;y++)for(let x=1;x<C-1;x++)if(walk(x,y))a.push([x,y]);return a;};
  const connected=()=>{const a=allCells();if(!a.length)return false;const d=bfs(a[0][0],a[0][1]);return a.every(([x,y])=>d[y][x]>=0);};
  if(!connected())return null;
  // 비상구: 바깥벽에 닿은 복도 끝
  const ex=[];for(let y=1;y<Rw-1;y++)for(let x=1;x<C-1;x++){if(!cor[y][x])continue;
    if(x===1)ex.push([x,y,0,y]);if(x===C-2)ex.push([x,y,C-1,y]);if(y===1)ex.push([x,y,x,0]);if(y===Rw-2)ex.push([x,y,x,Rw-1]);}
  if(!ex.length)return null;
  const E=ex[ri(0,ex.length-1)];G[E[1]][E[0]]='E';
  const dE=bfs(E[0],E[1]);let maxD=0;for(const[x,y]of allCells())maxD=Math.max(maxD,dE[y][x]);
  const sc=allCells().filter(([x,y])=>cor[y][x]&&dE[y][x]>=maxD*.65);if(!sc.length)return null;
  const S=sc[ri(0,sc.length-1)];
  // 사물함 (연결성 유지)
  const lockers=[],occ=new Set([S+'',E+'']);
  const lc=[];for(let y=1;y<Rw-1;y++)for(let x=1;x<C-1;x++){if(G[y][x]!=='.'||nearDoor(x,y)||(x===S[0]&&y===S[1]))continue;
    for(const[dx,dy]of D4){if(G[y-dy][x-dx]==='#'&&walk(x+dx,y+dy)&&!(cor[y][x]&&!cor[y+dy][x+dx])){lc.push([x,y,dx,dy]);break;}}}
  for(let i=lc.length-1;i>0;i--){const j=ri(0,i);[lc[i],lc[j]]=[lc[j],lc[i]];}
  const want=ri(7,9);
  for(const[x,y,dx,dy]of lc){if(lockers.length>=want)break;
    if(lockers.some(L=>Math.max(Math.abs(L.cx-x),Math.abs(L.cy-y))<5))continue;
    G[y][x]='L';if(!connected()){G[y][x]='.';continue;}
    lockers.push({cx:x,cy:y,x:x*T+16,y:y*T+16,f:{x:dx,y:dy}});occ.add([x,y]+'');}
  if(lockers.length<5)return null;
  // 아이템 배치
  const signs={};const sl=[];const dE2=bfs(E[0],E[1]);
  for(let y=1;y<Rw-1;y++)for(let x=1;x<C-1;x++){if(!cor[y][x]||!walk(x,y)||dE2[y][x]<3)continue;
    for(const[dx,dy]of D4){if(G[y+dy][x+dx]!=='#')continue;
      if(sl.some(([a,b])=>Math.abs(a-x)+Math.abs(b-y)<6))break;
      let bd=null;for(const[px,py]of[[dy,dx],[-dy,-dx]]){const nx=x+px,ny=y+py;if(inside(nx,ny)&&walk(nx,ny)&&dE2[ny][nx]>=0&&dE2[ny][nx]<dE2[y][x])bd=[px,py];}
      if(!bd)continue;signs[`${x+dx},${y+dy},${-dx},${-dy}`]={x:bd[0],y:bd[1]};sl.push([x,y]);break;}}
  const dS=bfs(S[0],S[1]);
  const free=allCells().filter(([x,y])=>G[y][x]==='.'&&dS[y][x]>=4&&!occ.has([x,y]+''));
  const take=(pool,n,minGap,score)=>{const out=[];
    for(let k=0;k<n;k++){let c=pool.filter(([x,y])=>!occ.has([x,y]+'')&&out.every(o=>Math.abs(o[0]-x)+Math.abs(o[1]-y)>=minGap));
      if(!c.length)return null;if(score){c.sort((a,b)=>score(b)-score(a));c=c.slice(0,Math.max(3,Math.ceil(c.length*.25)));}
      const v=c[ri(0,c.length-1)];out.push(v);occ.add(v+'');}return out;};
  const roomCells=free.filter(([x,y])=>roomOf[y][x]>=0&&dS[y][x]>=8);
  const talis=take(roomCells.length>=3?roomCells:free,3,7,([x,y])=>dS[y][x]+R()*6);if(!talis)return null;
  const notesP=take(free,5,5);const bats=take(free,3,6);const salt=take(free,2,6);const stones=take(free,3,5);
  if(!notesP||!bats||!salt||!stones)return null;
  const gc=allCells().filter(([x,y])=>dS[y][x]>=Math.max(12,maxD*.5)&&!occ.has([x,y]+'')&&G[y][x]==='.');if(!gc.length)return null;
  const GS=gc[ri(0,gc.length-1)];
  let bestA=0,bestRun=-1;for(const[dx,dy]of D4){let n=0;while(walk(S[0]+dx*(n+1),S[1]+dy*(n+1))&&n<30)n++;if(n>bestRun){bestRun=n;bestA=Math.atan2(dy,dx);}}
  // 바닥 낙서
  const corCells=allCells().filter(([x,y])=>cor[y][x]&&G[y][x]==='.');
  const wr=[];const rc=()=>corCells[ri(0,corCells.length-1)];
  {const c=rc();wr.push({x:c[0]*T+4,y:c[1]*T+22,a:(R()-.5)*.3,s:'돌아보지 마',f:'bold 22px serif',c:'rgba(130,10,10,.5)'});}
  {const c=rc();wr.push({x:c[0]*T,y:c[1]*T+20,a:(R()-.5)*.3,s:'여기가 출구야?',f:'bold 15px serif',c:'rgba(130,10,10,.45)'});}
  {const r=rooms[ri(0,rooms.length-1)];wr.push({x:r.x0*T+6,y:r.y0*T+18,a:0,s:'서연',f:'12px serif',c:'rgba(130,10,10,.4)'});}
  rooms.forEach((r,i)=>{if(R()<.5)wr.push({x:r.x0*T+4,y:r.y0*T+14,a:0,s:`${ri(1,3)}-${ri(1,8)}`,f:'14px serif',c:'rgba(200,200,190,.16)'});});
  return{C,Rw,G,lockers,exit:{x:E[0],y:E[1],wx:E[2],wy:E[3]},start:{x:S[0],y:S[1],a:bestA},ghost:{x:GS[0],y:GS[1]},
    talis,notes:notesP,bats,salt,stones,writings:wr,rooms:rooms.length,hub,signs,roomOf};
}
const NOW=new Date(),MON=NOW.getMonth()+1,DAY=NOW.getDate();

/* ---------- 스토리 쪽지 ---------- */
const NOTES=[
 {pos:[3,3],title:'교무일지 (찢어진 페이지)',text:`1998년 ${MON}월 ${DAY}일\n2학년 3반 한서연 학생,\n야간자율학습 이후 귀가하지 않음.\n마지막 목격 장소: 1-3 교실.\n\n…오늘과 같은 날짜다.`},
 {pos:[13,10],title:'구겨진 쪽지',text:'서연아 미안해.\n사물함에 가둔 건 그냥 장난이었어.\n문이 안 열릴 줄은 몰랐어.\n\n아무한테도 말 안 할게.\n그러니까 제발 나 찾아오지 마.'},
 {pos:[18,1],title:'경비원 수첩',text:'밤마다 복도에서 발소리가 난다.\n부적 세 장으로 교실에 묶어 두었다.\n절대 떼지 말 것.\n\n그 아이는 빛을 싫어한다.\n비추면 잠깐 멈추지만, 곧 미쳐 달려든다.\n소금을 뿌리면 물러난다.\n소리 나는 곳으로 간다.\n숨을 쉬면… 듣는다.'},
 {pos:[5,12],title:'책상 서랍 속 낙서',text:'어두워\n숨 쉬는 소리가 들려\n내 소리야? 아니면\n\n누가 거기 있어?\n누가 나 좀 불러줘\n내 이름 좀'},
 {pos:[20,16],title:'신문 스크랩 (2001년)',text:'○○고 실종 여고생, 3년째 행방 묘연\n\n학교 측 "구관 폐쇄 예정"\n유족 "딸의 이름만이라도\n기억해 주길 바란다"'}];

/* ---------- 화면 ---------- */
let SW=0,SH=0,DPR=1;
const vig=document.createElement('canvas');
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);SW=window.innerWidth;SH=window.innerHeight;
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cv.style.width=SW+'px';cv.style.height=SH+'px';
  vig.width=Math.max(1,SW>>1);vig.height=Math.max(1,SH>>1);const v=vig.getContext('2d');
  const g=v.createRadialGradient(vig.width/2,vig.height/2,Math.min(vig.width,vig.height)*.3,vig.width/2,vig.height/2,Math.hypot(vig.width,vig.height)*.55);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');v.fillStyle=g;v.fillRect(0,0,vig.width,vig.height);
}
const screenTf=c=>c.setTransform(DPR,0,0,DPR,0,0);

/* ---------- 정적 맵 ---------- */
const bg=document.createElement('canvas');
function buildBG(){bg.width=W;bg.height=H;seed=11;
  const b=bg.getContext('2d');
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x],px=x*T,py=y*T;
    if(c==='#'){
      b.fillStyle='#181515';b.fillRect(px,py,T,T);b.strokeStyle='#0b0a0a';b.lineWidth=1;
      for(let r=0;r<4;r++){b.beginPath();b.moveTo(px,py+r*8+.5);b.lineTo(px+T,py+r*8+.5);b.stroke();
        for(let k=(r%2)*8;k<T;k+=16){b.beginPath();b.moveTo(px+k+.5,py+r*8);b.lineTo(px+k+.5,py+r*8+8);b.stroke();}}
      if(rnd()<.3){b.fillStyle='rgba(40,50,30,.35)';b.fillRect(px+rnd()*20,py+rnd()*20,6+rnd()*10,4+rnd()*8);}
      continue;
    }
    b.fillStyle=(x+y)%2?'#3b3a33':'#33322c';b.fillRect(px,py,T,T);
    b.strokeStyle='rgba(0,0,0,.35)';b.strokeRect(px+.5,py+.5,T-1,T-1);
    if(rnd()<.3){b.fillStyle=`rgba(18,12,8,${.2+rnd()*.35})`;b.beginPath();b.ellipse(px+rnd()*T,py+rnd()*T,4+rnd()*10,3+rnd()*6,rnd()*3,0,7);b.fill();}
    if(rnd()<.12){b.strokeStyle='rgba(0,0,0,.5)';b.beginPath();let sx=px+rnd()*T,sy=py+rnd()*T;b.moveTo(sx,sy);
      for(let i=0;i<4;i++){sx+=rnd()*12-6;sy+=rnd()*12-6;b.lineTo(sx,sy);}b.stroke();}
    if(opaque(x,y-1)){const g=b.createLinearGradient(0,py,0,py+12);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(px,py,T,12);}
    if(c==='d'){

    for(const b of bats)if(!b.got&&dist(b,p)<18){b.got=true;battery=Math.min(100,battery+45);click();buzz(30);say('건전지를 주웠다 (+45%)',2.5);}
    if(!p.noteHint&&nearNote()){p.noteHint=true;say(inputMode==='touch'?'바닥에 쪽지가 있다. [읽기] 버튼으로 주울 수 있다.':'바닥에 쪽지가 있다. E 키로 주울 수 있다.',3.5);}

}
function movePlayer(dt){
  let fwd=0,str=0,mag=1;
  if(keys.w||keys.arrowup)fwd++;if(keys.s||keys.arrowdown)fwd--;if(keys.d)str++;if(keys.a)str--;
  if(keys.arrowleft)p.a-=2.4*dt;if(keys.arrowright)p.a+=2.4*dt;
  const sv=stickVec(mv);if(sv){fwd=-sv.y;str=sv.x;mag=Math.max(.35,sv.m);}
  const ml=Math.hypot(fwd,str);
  const wantRun=ml>0&&fwd>.3&&(keys.shift||(sv&&sv.m>.95));
  if(stamina<5)p.tired=true;if(stamina>30)p.tired=false;
  p.running=wantRun&&!p.tired;p.moving=ml>0;
  if(p.running)stamina=Math.max(0,stamina-26*dt);else stamina=Math.min(100,stamina+(ml>0?12:20)*dt);
  if(ml>0){fwd/=ml;str/=ml;const sp=(p.running?160:95*mag)*dt,ca=Math.cos(p.a),sa=Math.sin(p.a);
    const mx=ca*fwd-sa*str,my=sa*fwd+ca*str;
    const nx=p.x+mx*sp;if(!hit(nx,p.y,p.r))p.x=nx;const ny=p.y+my*sp;if(!hit(p.x,ny,p.r))p.y=ny;
    p.bobPh+=dt*(p.running?13:8.5)*mag;
    stepT-=dt;if(stepT<=0){stepT=p.running?.28:.46/mag;step(p.running?.14:.05);}}
  p.noise=ml>0?(p.running?290:(mag<.6?40:90)):Math.max(0,p.noise-300*dt);
}
function hiddenUpdate(dt,dG){
  p.noise=0;holdLock-=dt;p.hideT=(p.hideT||0)+dt;

  p.nearWarn=near;

    breath-=14*dt;noiseM=Math.max(0,noiseM-50*dt);           // 약 7초 참을 수 있음
    if(breath<=0){breath=0;holding=false;holdLock=1.2;gasp();buzz(200);
      if(near&&dG<60)toStare();else if(near)noiseM=Math.min(100,noiseM+55);}
  }else{
    breath=Math.min(100,breath+40*dt);
    if(near)noiseM=Math.min(100,noiseM+(dG<60?40:22)*dt);else noiseM=Math.max(0,noiseM-30*dt);
    stepT-=dt;if(stepT<=0){stepT=1.1;noise(.5,800,1.5,near?.06:.025);}

    g.cool=1.5;Object.assign(g,randCell(null,null,0,330));g.dx=g.x;g.dy=g.y;g.state='hunt';g.lastKnown={x:p.x,y:p.y};}

function ghostUpdate(dt){
  const dG=dist(g,p);g.cool-=dt;g.immune-=dt;g.lockerCD=(g.lockerCD||0)-dt;
  g.look+=(g.lookT-g.look)*Math.min(1,dt*5);
  const ang=Math.atan2(g.y-p.y,g.x-p.x);
  g.lit=lightOn()&&dG<LIGHT_R+12&&Math.abs(angDiff(ang,p.a))<CONE+.12&&los(p.x,p.y,g.x,g.y);
  if(g.cool>0){g.dx=g.x;g.dy=g.y;return;}
  if(g.lit&&g.immune<=0&&!['freeze','rush'].includes(g.state)){
    g.state='freeze';g.freezeT=.9;g.immune=7;noise(.4,500,3,.2,'bandpass',0,ghostPan());
    if(!g.seen){g.seen=true;say('빛을 비추자 그것이 멈칫했다…',2.2);}}
  if(g.state==='freeze'){g.freezeT-=dt;g.dx=g.x+(Math.random()-.5)*4;g.dy=g.y+(Math.random()-.5)*2;
    if(g.freezeT<=0){g.state='rush';g.rushT=3.2;shriek(ghostPan());buzz([60,40,120]);shakeT=.3;
      if(!g.rushSeen){g.rushSeen=true;say('달려든다! 도망쳐!',2.2);}}return;}
  if(g.pauseT>0){g.pauseT-=dt;g.dx=g.x;g.dy=g.y;if(g.pauseT<=0&&g.state!=='stare')g.lookT=0;return;}
  const n=collected();
  if(g.state==='stare'&&!p.hidden){g.state='hunt';g.lastKnown={x:p.x,y:p.y};g.lostT=0;}
  if(g.state==='rush'&&p.hidden){g.state=g.sawHide?'check':'search';g.lastKnown={x:p.x,y:p.y};g.target=p.prev;g.searchT=7;g.lingerT=2.2+Math.random()*1.3;}
  if(!['rush','stare'].includes(g.state)){
    if(!p.hidden){
      const see=(light&&battery>0)?300:150;
      let det=phase3||(dG<see&&los(g.x,g.y,p.x,p.y))||dG<p.noise;
      if(det){if(g.state!=='hunt'){g.state='hunt';if(dG<260){sting();say(p.running?'발소리를 들켰다!':'눈이 마주쳤다.',2.5);}}
        g.lastKnown={x:p.x,y:p.y};g.lostT=0;}
      else if(g.state==='hunt'){g.lostT+=dt;if(g.lostT>3){g.state='search';g.searchT=7;g.target=g.lastKnown;}}
    }else if(g.state==='hunt'){
      g.lostT+=dt;if(g.sawHide){g.state='check';g.lastKnown={x:p.x,y:p.y};g.lingerT=2.2+Math.random()*1.3;}
      else if(g.lostT>2.5){g.state='search';g.searchT=7;g.target=g.lastKnown;}
    }
  }
  const front=p.hidden?{x:p.hidden.x+p.hidden.f.x*30,y:p.hidden.y+p.hidden.f.y*30}:null;
  let tgt=null,speed=0;
  switch(g.state){
    case 'wander':speed=n===0?32:40;
      if(!g.target||dist(g,g.target)<6){
        if(p.hidden&&p.hideT>15&&g.lockerCD<=0&&Math.random()<.3){const c=front;g.target=randCell(Math.floor(c.x/T),Math.floor(c.y/T),2);}
        else{const pc=[Math.floor(p.x/T),Math.floor(p.y/T)];g.target=Math.random()<.45?randCell(pc[0],pc[1],6):randCell();}}
      tgt=g.target;break;
    case 'hunt':speed=phase3?92:56+n*12;tgt=g.lastKnown;break;
    case 'rush':speed=150;tgt={x:p.x,y:p.y};g.rushT-=dt;if(g.rushT<=0){g.state='hunt';g.lastKnown={x:p.x,y:p.y};g.lostT=0;}break;
    case 'search':speed=44;g.searchT-=dt;
      if(!g.target||dist(g,g.target)<6){const c=[Math.floor(g.lastKnown.x/T),Math.floor(g.lastKnown.y/T)];g.target=randCell(c[0],c[1],3);}
      tgt=g.target;if(g.searchT<=0){g.state='wander';g.target=null;}break;
    case 'check':speed=50;tgt=front||g.lastKnown;
      if(dist(g,tgt)<8){speed=0;g.lingerT-=dt;g.lookT=Math.sin(time*1.7)>.55?1:0;
        if(g.lingerT<=0){g.state='wander';g.sawHide=false;g.lookT=0;g.lockerCD=12;g.target=randCell(null,null,0,300);say('…발소리가 멀어진다.',3);}}
      break;
    case 'stare':speed=55;tgt=front;g.lookT=1;
      if(!tgt){g.state='hunt';break;}
      if(dist(g,tgt)<6){speed=0;g.stareT+=dt;if(g.stareT>2.3){caught('사물함 문이 열렸다.');return;}}
      break;
  }
  if(tgt&&speed>0){
    const gcx=Math.floor(g.x/T),gcy=Math.floor(g.y/T),tcx=Math.floor(tgt.x/T),tcy=Math.floor(tgt.y/T);
    g.repath-=dt;if(g.repath<=0){g.repath=g.state==='rush'?.15:.3;g.next=bfsNext(gcx,gcy,tcx,tcy);}
    const t2=g.next&&!(gcx===tcx&&gcy===tcy)?cell(g.next.x,g.next.y):tgt;
    const dx=t2.x-g.x,dy=t2.y-g.y,l=Math.hypot(dx,dy),sp=speed*dt;
    if(l>1){g.x+=dx/l*Math.min(sp,l);g.y+=dy/l*Math.min(sp,l);}

  }
  if(g.state==='hunt'||g.state==='rush'){g.jerk-=dt;if(g.jerk<=0){g.jerk=g.state==='rush'?.06:.11;g.dx=g.x;g.dy=g.y;}}else{g.dx=g.x;g.dy=g.y;}
  if(!p.hidden&&dist(g,p)<21)caught('');
}

/* ---------- 1인칭 렌더링 ---------- */
const EYE=34,WALLH=72;
const sc=(r,g2,b,k)=>`rgb(${r*k|0},${g2*k|0},${b*k|0})`;
let zbuf=new Float32Array(0),fbuf=null,fctx=null,fimg=null;
const shadeCache=[];for(let i=0;i<=50;i++)shadeCache.push(`rgba(0,0,0,${(1-i/50).toFixed(2)})`);
function renderFP(ex,ey,a,R,o){
  const cx=R.x+R.w/2,hz=R.y+R.h/2+(o.bob||0),PP=(R.w/2)/Math.tan(o.fov/2)*(o.zoom||1);
  const LR=o.LR,amb=o.amb,kf=d=>{const v=1.08-d/LR;return v<=0?0:(v>1?1:v)*amb;};
  const ca=Math.cos(a),sa=Math.sin(a);
  const fw=Math.round(clamp(R.w/3.4,90,300)),fh=Math.max(4,Math.round(fw*R.h/R.w));
  if(!fbuf||fbuf.width!==fw||fbuf.height!==fh){fbuf=document.createElement('canvas');fbuf.width=fw;fbuf.height=fh;fctx=fbuf.getContext('2d');fimg=fctx.createImageData(fw,fh);}
  const D=fimg.data,WP=worldPix,hb0=MAPINFO.hub,HB=hb0?[hb0.x0*T,hb0.y0*T,(hb0.x1+1)*T,(hb0.y1+1)*T]:null;
  for(let y=0;y<fh;y++){
    const dy=R.y+(y+.5)/fh*R.h-hz,row=y*fw*4;
    if(Math.abs(dy)<.6){for(let x=0;x<fw;x++){const i=row+x*4;D[i]=D[i+1]=D[i+2]=0;D[i+3]=255;}continue;}
    const fl=dy>0,dd=(fl?EYE:(WALLH-EYE))*PP/Math.abs(dy),k=kf(dd);
    for(let x=0;x<fw;x++){
      const camx=(R.x+(x+.5)/fw*R.w-cx)/PP,wx=ex+dd*(ca-camx*sa),wy=ey+dd*(sa+camx*ca);
      let r=0,g2=0,b=0;
      let kk=k;
      if(fl){const ix=wx|0,iy=wy|0;if(ix>=0&&iy>=0&&ix<W&&iy<H){const j=(iy*W+ix)*4;r=WP[j];g2=WP[j+1];b=WP[j+2];
        if(HB&&ix>=HB[0]&&ix<HB[2]&&iy>=HB[1]&&iy<HB[3]){kk=Math.max(k,.36);r*=.82;b*=1.2;}}}
      else{const u=((wx%64)+64)%64,v=((wy%64)+64)%64;
        if(u<2||v<2){r=16;g2=16;b=18;}else if(u>22&&u<42&&v>8&&v<56){r=72;g2=74;b=72;}else{r=40;g2=39;b=36;}}
      const i=row+x*4;D[i]=r*kk;D[i+1]=g2*kk;D[i+2]=b*kk;D[i+3]=255;}
  }
  fctx.putImageData(fimg,0,0);
  ctx.save();ctx.beginPath();ctx.rect(R.x,R.y,R.w,R.h);ctx.clip();
  ctx.imageSmoothingEnabled=true;ctx.drawImage(fbuf,R.x,R.y,R.w,R.h);
  const colW=Math.max(2,Math.round(R.w/360)),cols=Math.ceil(R.w/colW);
  if(zbuf.length!==cols)zbuf=new Float32Array(cols);
  const px=ex/T,py=ey/T,MK=o.mark||0;ctx.imageSmoothingEnabled=false;
  for(let i=0;i<cols;i++){
    const sx=R.x+i*colW,camx=(sx+colW/2-cx)/PP,rdx=ca-camx*sa,rdy=sa+camx*ca;
    let mx=Math.floor(px),my=Math.floor(py);
    const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);let stx,sty,sdx,sdy;
    if(rdx<0){stx=-1;sdx=(px-mx)*ddx;}else{stx=1;sdx=(mx+1-px)*ddx;}
    if(rdy<0){sty=-1;sdy=(py-my)*ddy;}else{sty=1;sdy=(my+1-py)*ddy;}
    let side=0,hw=false;
    for(let n=0;n<64;n++){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0;}else{sdy+=ddy;my+=sty;side=1;}
      if(MK&&(side===0?sdx-ddx:sdy-ddy)*T<MK)markCell(mx,my);if(opaque(mx,my)){hw=true;break;}}
    if(!hw){zbuf[i]=1e9;continue;}
    const perp=Math.max(.5,(side===0?sdx-ddx:sdy-ddy)*T);zbuf[i]=perp;
    let u=side===0?py+(perp/T)*rdy:px+(perp/T)*rdx;u-=Math.floor(u);
    if(side===0&&rdx<0)u=1-u;if(side===1&&rdy>0)u=1-u;
    const tex=texFor(mx,my,side,stx,sty);if(MK&&tex===TEX.exit&&perp<MK*1.4)exitSeen=true;
    const top=hz-(WALLH-EYE)/perp*PP,hgt=WALLH/perp*PP;

  ctx.font=`${Math.min(13,SW*.034)}px sans-serif`;ctx.fillStyle='rgba(255,255,255,.4)';
  y=wrap('🎧 이어폰 권장 (소리가 방향을 알려줍니다)',SW/2,y,mw,fs*1.5);
  if(inputMode==='touch')y=wrap('왼손 엄지: 이동 (끝까지 밀면 달리기) · 오른손: 드래그로 둘러보기',SW/2,y,mw,fs*1.5);
  else y=wrap('WASD 이동 · 마우스 시점 · 클릭/F 손전등 · E 숨기 · P 지도',SW/2,y,mw,fs*1.5);
  y+=fs*.4;ctx.fillStyle='rgba(200,180,140,.65)';ctx.font=`${Math.min(13,SW*.034)}px sans-serif`;y=wrap(`이번 학교: 시드 ${SEED} · 아래 칸에 시드를 넣으면 그 학교로`,SW/2,y,mw,fs*1.5);
  const best=store.get('best',null),ends=store.get('endings',[]);
  if(best!=null||ends.length){y+=fs*.6;ctx.fillStyle='rgba(200,180,140,.5)';
    wrap(`최고 기록 ${best!=null?best.toFixed(1)+'초':'-'} · 본 엔딩 ${ends.length}/2`,SW/2,y,mw,fs*1.5);}
}
function drawEnd(title,color,lines,e,hint){
  screenTf(ctx);ctx.globalAlpha=Math.min(1,e*.8);ctx.textAlign='center';
  ctx.fillStyle=color;ctx.font=`800 ${Math.min(46,SW*.11)}px ${SERIF}`;ctx.fillText(title,SW/2,SH*.36);
  ctx.font=`${Math.min(16,SW*.042)}px ${SERIF}`;ctx.fillStyle='#aaa';let y=SH*.36+46;
  lines.forEach((l,i)=>{ctx.globalAlpha=clamp((e-.6-i*.9)*1.2,0,1);ctx.fillText(l,SW/2,y,SW-30);y+=30;});
  ctx.globalAlpha=1;
  if(hint){ctx.font='12px sans-serif';ctx.fillStyle='rgba(200,180,140,.6)';ctx.fillText(hint,SW/2,y+10,SW-30);y+=24;}
  if(e>1.4){const b=endBtns();ctx.textBaseline='middle';
    for(const[r,l,sub]of[[b.same,'같은 학교 다시',inputMode==='touch'?'':'R'],[b.next,'새 학교',inputMode==='touch'?'':'N']]){
      ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
      ctx.fillStyle='#ddd';ctx.font='15px sans-serif';ctx.fillText(l+(sub?` (${sub})`:''),r.x+r.w/2,r.y+r.h/2);}
    ctx.textBaseline='alphabetic';ctx.font='12px sans-serif';ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillText(`시드 ${SEED}`,SW/2,b.same.y+b.same.h+24);}
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  update(dt);
  if(state==='title'){drawTitle();drawPost(false);if(seedIn.style.display!=='block')seedIn.style.display='block';}
  else if(seedIn.style.display!=='none')seedIn.style.display='none';
  if(state==='title'){}
  else if(state==='play'){if(p.hidden)drawLockerFP(p.hidden);else drawMainFP();
    if(!paused&&!reading){postFX();
      if(!p.hidden&&g.cool<=0&&dist(g,p)<230&&Math.random()<.0035)faceT=time;
      if(time-faceT<.07){ctx.save();ctx.globalAlpha=.35;drawFace(1.25,time,true);ctx.restore();}}
    drawPost(true);drawHUD();}
  else if(state==='caught'){const e=time-endT;
    if(e<.12){screenTf(ctx);ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SH);}
    else if(e<1.3){drawFace(.8+Math.pow((e-.12)/1.2,2)*1.4,time);drawPost(false);}
    else{screenTf(ctx);ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SH);
      drawEnd('잡혔다','#a11',[caughtWhy||'그것과 눈이 마주쳤다.',`부적 ${collected()}/3 · 쪽지 ${notesGot()}/5 · ${playTime.toFixed(1)}초`],e-1.3,
        ['빛을 비추면 잠깐 멈칫한 뒤 달려듭니다. 비추기 전에 도망칠 길을 확인하세요.','돌을 던지면 그쪽으로 유인할 수 있습니다.','소금은 가까이 있을 때 써야 효과가 있습니다.','사물함 안에서는 가까이 오면 숨을 참으세요. 돌아보면 이미 의심하는 것입니다.','손전등을 끄면 덜 눈에 띕니다.','달리면 발소리가 멀리까지 들립니다.'][Math.floor(endT)%6]);drawPost(false);}}
  else if(state==='win'){const e=time-endT;screenTf(ctx);
    if(ending==='true'){const k=clamp(e/8,0,1);ctx.fillStyle=`rgb(${Math.round(10+k*60)},${Math.round(10+k*40)},${Math.round(20+k*50)})`;ctx.fillRect(0,0,SW,SH);
      const gg=ctx.createLinearGradient(0,SH,0,SH*.4);gg.addColorStop(0,`rgba(255,170,110,${k*.5})`);gg.addColorStop(1,'rgba(255,170,110,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,SW,SH);
      drawEnd('TRUE END','#f0e0c0',['교문 앞에 그 아이가 서 있었다.','"서연아."','이름을 부르자, 그 아이가 처음으로 웃었다.','"…기억해 줘서 고마워."',`기록 ${playTime.toFixed(1)}초`],e,null);
      if(e>2.6&&e<6){bigGhost(SW/2,SH*.82,Math.min(SW,SH)/120,clamp((6-e)/3,0,.7));}
    }else{ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SH);
      drawEnd('탈출했다','#ddd',[`기록 ${playTime.toFixed(1)}초 · 쪽지 ${notesGot()}/5`,'…그런데, 교문 앞에 누가 서 있다.','"왜 내 이름은 안 불러줘?"'],e,'쪽지 5장을 모두 모으면 다른 결말이 있습니다.');
      if(e>3&&e<3.3)bigGhost(SW/2,SH*.82,Math.min(SW,SH)/90,.85);}
    drawPost(false);}
  requestAnimationFrame(frame);
}
const seedIn=document.getElementById('seedIn');
seedIn.addEventListener('input',()=>{const v=cleanSeed(seedIn.value);if(v!==seedIn.value)seedIn.value=v;});
['touchstart','touchend','mousedown'].forEach(ev=>seedIn.addEventListener(ev,e=>e.stopPropagation()));
resize();{const m=(location.hash||'').match(/^#seed-([A-Za-z0-9]{1,10})$/);const sd=m?cleanSeed(m[1]):newSeed();if(!loadMap(sd))loadMap(newSeed());}
reset();state='title';requestAnimationFrame(frame);
</script>
